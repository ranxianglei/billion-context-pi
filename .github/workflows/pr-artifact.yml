name: PR Build Artifact

on:
    pull_request:
        branches: [master]

permissions:
    contents: read
    pull-requests: write

jobs:
    build-artifact:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci

            - run: npm run build

            - name: Publish to npm with PR tag
              # Fork PRs have no access to NPM_TOKEN (secrets are withheld from
              # forks) — publishing would fail with ENEEDAUTH and kill the whole
              # job, so fork PRs skip npm but still get the tarball artifact +
              # comment below (#413; same fix as opencode-acp#366 / billion-context#670).
              if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
              run: |
                  PR_NUMBER="${{ github.event.pull_request.number }}"
                  RUN_NUMBER="${{ github.run_number }}"
                  BASE_VERSION=$(node -p "require('./package.json').version")
                  # Strip any existing prerelease suffix
                  BASE_VERSION=$(echo "$BASE_VERSION" | sed 's/-.*//')
                  PR_VERSION="${BASE_VERSION}-pr.${PR_NUMBER}.${RUN_NUMBER}"

                  echo "Publishing version $PR_VERSION with tag pr-${PR_NUMBER}"
                  npm version "$PR_VERSION" --no-git-tag-version
                  npm publish --tag "pr-${PR_NUMBER}" --access public --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create installable tarball
              run: |
                  npm pack
                  PR_NUM="${{ github.event.pull_request.number }}"
                  TARBALL=$(ls billion-context-pi-*.tgz | head -1)
                  if [ -n "$PR_NUM" ] && [ -n "$TARBALL" ]; then
                    cp "$TARBALL" "billion-context-pi-pr${PR_NUM}.tgz"
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: billion-context-pi-pr-${{ github.event.pull_request.number }}
                  path: |
                      billion-context-pi-pr*.tgz
                      dist/
                  retention-days: 30

            - name: Comment on PR with install instructions
              # Fork PRs get a read-only GITHUB_TOKEN (same withholding policy as
              # secrets) — issues.createComment would 403 there, so don't let that
              # fail the otherwise-green fork build (#413).
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const prNumber = context.payload.pull_request.number;
                      const sha = context.payload.pull_request.head.sha.slice(0, 7);
                      const branch = context.payload.pull_request.head.ref;
                      const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const isFork = context.payload.pull_request.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;

                      const body = [
                          '## 📦 Built Extension Artifact',
                          '',
                          `**Branch:** \`${branch}\` (${sha})`,
                          '',
                          ...(isFork ? [
                              '> ℹ️ This PR comes from a fork — npm PR-tag publishing is skipped (no registry credentials). Use the artifact below.',
                              '',
                          ] : [
                              '### Option A — Install from npm PR tag (recommended)',
                              '',
                              '```bash',
                              'pi install npm:billion-context-pi@pr-' + prNumber,
                              '```',
                              '',
                              'Each push to this PR publishes a new version under the `pr-' + prNumber + '` npm tag.',
                              '',
                          ]),
                          '### Option B — Download artifact',
                          '',
                          `1. Download the artifact from the [Actions run](${runUrl})`,
                          '2. Extract the tarball and install:',
                          '',
                          '```bash',
                          'tar xzf billion-context-pi-pr' + prNumber + '.tgz',
                          'pi install ./package',
                          '```',
                          '',
                          '---',
                          '*This comment is automatically updated on each push.*',
                      ].join('\n');

                      // Find and update existing comment, or create new one
                      const comments = await github.rest.issues.listComments({
                          ...context.repo,
                          issue_number: prNumber,
                      });

                      const existing = comments.data.find(c =>
                          c.user.type === 'Bot' && c.body.includes('📦 Built Extension Artifact')
                      );

                      if (existing) {
                          await github.rest.issues.updateComment({
                              ...context.repo,
                              comment_id: existing.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              ...context.repo,
                              issue_number: prNumber,
                              body,
                          });
                      }
